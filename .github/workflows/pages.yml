# Publishes demo/ to GitHub Pages.
# Runs on pushes to main and on demand (Actions tab → "Run workflow"). The configure-pages step
# enables Pages for the repository on first use, so no manual Settings → Pages step is needed.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
