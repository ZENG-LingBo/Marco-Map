<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narrative · Marco-Map demo</title>
  <meta name="description" content="Scrollytelling narrative that flies a deep-zoom map to each passage's place, with the original text beside the commentary.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+TC:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/demo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
</head>
<body class="story-page">
  <header class="topbar">
    <a class="brand" href="index.html">Marco-Map · demo</a>
    <div class="title"><span class="en">Narrative mode</span></div>
    <div class="spacer"></div>
    <div class="controls">
      <select id="storySelect" class="select" aria-label="Choose a map"></select>
      <a class="btn" href="viewer.html">Open the viewer</a>
    </div>
  </header>
  <div class="story">
    <div class="text" id="storyText"></div>
    <div class="stage-wrap">
      <div id="osd" aria-label="Zoomable map"></div>
      <div class="caption" id="caption"></div>
    </div>
  </div>
  <script src="js/story.js"></script>
</body>
</html>
