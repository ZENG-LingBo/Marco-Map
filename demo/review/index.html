      try { saved = sessionStorage.getItem(KEY); } catch (e) {}
      if (saved) open(saved, false);
      document.getElementById('unlock').addEventListener('submit', function (e) {
        e.preventDefault();
        open(document.getElementById('pw').value, true);
      });
    })();
  </script>
</body>
</html>
